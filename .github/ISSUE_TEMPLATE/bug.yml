name: Ошибка
description: Что-то не работает или работает не так, как в официальном приложении
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: «Настройки → О приложении»
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS
      placeholder: "macOS 15"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали, что ожидали увидеть и что получилось. Скриншоты сюда же.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Лог
      description: >
        Последние строки `~/Library/Application Support/yamusic-rs/log.txt`. Числовой ID
        аккаунта в адресах можно заменить на ***.
      render: text
