name: Сборка macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
      - run: printf 'CARGO_TARGET_DIR=%s/music-rust-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Проверка тега
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          test "v$version" = "$GITHUB_REF_NAME"

      - run: cargo clippy --locked --release --all-targets -- -D warnings
      - run: cargo test --locked --release
      - run: |
          python3 -m venv "$RUNNER_TEMP/dmg-tools"
          "$RUNNER_TEMP/dmg-tools/bin/pip" install dmgbuild==1.6.7
          PATH="$RUNNER_TEMP/dmg-tools/bin:$PATH" bash tools/macos-dmg.sh "$RUNNER_TEMP/music-rust-macos-arm64.dmg"
      - run: shasum -a 256 "$RUNNER_TEMP/music-rust-macos-arm64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/music-rust-macos-arm64.dmg
          archive: false

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Релиз macOS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          asset=music-rust-macos-arm64.dmg
          if gh release view "$GITHUB_REF_NAME" --json tagName >/dev/null 2>&1; then
            existing=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.name == "music-rust-macos-arm64.dmg") | .state')
            if [ "$existing" != uploaded ]; then
              gh release upload "$GITHUB_REF_NAME" "dist/$asset"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "dist/$asset" --verify-tag --title "Яндекс Музыка Rust ${GITHUB_REF_NAME#v} для macOS" --generate-notes
          fi
